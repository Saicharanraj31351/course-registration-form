
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #4935a3;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin: 15px 0 7px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            background: #fff;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        textarea {
            resize: vertical;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .terms input {
            width: auto;
        }

        .terms label {
            margin: 0;
            font-size: 14px;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #5b4bce;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.3s;
        }

        button:hover {
            background: #4233a5;
        }

        .reset-btn {
            background: #6c757d;
        }

        .reset-btn:hover {
            background: #50565c;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            line-height: 1.6;
        }

        .success {
            color: #16803c;
            background: #e7f8ed;
            padding: 15px;
            border-radius: 8px;
        }

        .error {
            color: #b42318;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Course Registration</h1>
        <p class="subtitle">Register for your favorite course</p>

        <form id="registrationForm">

            <label for="name">Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter 10-digit mobile number"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label for="roll">Roll Number</label>
            <input type="text" id="roll"
                   placeholder="Enter your roll number" required>

            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="department">Department</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics">Electronics</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
            </select>

            <label for="course">Select Course</label>
            <select id="course" required>
                <option value="">Choose a Course</option>
                <option value="Web Development">Web Development</option>
                <option value="Java Programming">Java Programming</option>
                <option value="Python Programming">Python Programming</option>
                <option value="Data Science">Data Science</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
                <option value="Database Management">Database Management</option>
            </select>

            <label for="semester">Semester</label>
            <select id="semester" required>
                <option value="">Select Semester</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select>

            <label for="date">Registration Date</label>
            <input type="date" id="date" required>

            <label for="address">Address</label>
            <textarea id="address" rows="3"
                      placeholder="Enter your address"
                      required></textarea>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I confirm that the information is correct.
                </label>
            </div>

            <button type="submit">Register Now</button>
            <button type="reset" class="reset-btn">Clear Form</button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>
    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const message = document.getElementById("message");
        const dateInput = document.getElementById("date");

        // Set today's date automatically.
        const today = new Date();

        const localDate = [
            today.getFullYear(),
            String(today.getMonth() + 1).padStart(2, "0"),
            String(today.getDate()).padStart(2, "0")
        ].join("-");

        dateInput.value = localDate;
        dateInput.max = localDate;

        // Handle form submission.
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const roll = document.getElementById("roll").value.trim();
            const gender = document.getElementById("gender").value;
            const department = document.getElementById("department").value;
            const course = document.getElementById("course").value;
            const semester = document.getElementById("semester").value;
            const date = dateInput.value;
            const address = document.getElementById("address").value.trim();

            message.className = "";
            message.textContent = "";

            // Validate phone number.
            if (!/^[0-9]{10}$/.test(phone)) {
                message.className = "error";
                message.textContent =
                    "Please enter a valid 10-digit phone number.";
                return;
            }

            // Validate required information.
            if (!name || !email || !roll || !gender ||
                !department || !course || !semester ||
                !date || !address) {
                message.className = "error";
                message.textContent =
                    "Please fill in all required fields.";
                return;
            }

            // Display success message.
            message.className = "success";
            message.textContent =
                "Registration Successful! Welcome, " + name +
                ". Your selected course is " + course + ".";

            // Display registration details.
            alert(
                "COURSE REGISTRATION SUCCESSFUL!\n\n" +
                "Name: " + name + "\n" +
                "Email: " + email + "\n" +
                "Phone: " + phone + "\n" +
                "Roll Number: " + roll + "\n" +
                "Gender: " + gender + "\n" +
                "Department: " + department + "\n" +
                "Course: " + course + "\n" +
                "Semester: " + semester + "\n" +
                "Registration Date: " + date
            );
        });

        // Clear the message when the form is reset.
        form.addEventListener("reset", function() {
            message.textContent = "";
            message.className = "";
        });
    </script>

</body>
</html>
